name: Folio iPhone sideload build
run-name: Folio iPhone build retry

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: folio-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sideloadable-ipa:
    name: Sideloadable iPhone IPA (unsigned)
    runs-on: macos-15
    if: github.event_name != 'pull_request'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('Folio.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project Folio.xcodeproj -scheme Folio

      - name: Build for physical iPhone (unsigned)
        run: |
          xcodebuild \
            -project Folio.xcodeproj \
            -scheme Folio \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package device app as IPA
        run: |
          APP_PATH="build-device/Build/Products/Release-iphoneos/Folio.app"
          test -d "$APP_PATH"
          mkdir -p ipa/Payload
          ditto "$APP_PATH" ipa/Payload/Folio.app
          (cd ipa && /usr/bin/zip -qry ../Folio-iOS-Unsigned.ipa Payload)
          file Folio-iOS-Unsigned.ipa

      - name: Upload unsigned device IPA
        uses: actions/upload-artifact@v4
        with:
          name: Folio-iOS-Unsigned-IPA
          path: Folio-iOS-Unsigned.ipa
          if-no-files-found: error


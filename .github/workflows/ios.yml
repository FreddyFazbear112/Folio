name: iOS build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: folio-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('Folio.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project Folio.xcodeproj -scheme Folio

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project Folio.xcodeproj \
            -scheme Folio \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package simulator app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/Build/Products/Debug-iphonesimulator/Folio.app \
            Folio-iOS-Simulator.zip

      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: Folio-iOS-Simulator
          path: Folio-iOS-Simulator.zip
          if-no-files-found: error
